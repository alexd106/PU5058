name: "PU5058"
output_dir: "docs"
navbar:
  title: "PU5058"
  icon: fa-home
  left:
    - text: "Home"
      icon: fa-home
      href: index.html
    - text: "Setup"
      icon: fa-cog
      href: setup.html
    - text: "Learn"
      icon: fa-desktop
      menu:
        - text: "How-to"
          icon: fa-tv
          href: howto.html
    - text: "R Book"
      icon: fa-book
      menu:
        - text: "Web book"
          icon: fa-firefox
          href: https://intro2r.com
        - text: "----"
        - text: "PDF book"
          icon: fa-file-pdf
          href: https://github.com/alexd106/Rbook/raw/master/docs/Rbook.pdf
    - text: "Exercises"
      icon: fa-book
      href: exercises.html
    - text: "Exercise Solutions"
      icon: fa-book
      href: exercise_solutions.html
    - text: "Data"
      icon: fa-download
      href: "data.html"
    - text: "Info"
      icon: fa-question-circle
      menu:
        - text: "Resources"
          icon: fa-book
          href: "resources.html"
        - text: "Source code"
          icon: fa-github fa-lg
          href: https://github.com/alexd106/PU5058

output:
  html_document:
    theme: flatly
    highlight: tango
    toc: true
    toc_depth: 2
    toc_float:
      collapsed: false
    fig_align: center
    includes:
    # css: 'styles.css'
    # css:
    #  - https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css
    #  - styles.css

include: [".nojekyll", "data/*", "exercises/*.pdf", "exercise_solutions/*.R"]
exclude: ["LICENSE", "README.md", "*.Rproj", "*.key", "*.psd", "rmd_archive"]
